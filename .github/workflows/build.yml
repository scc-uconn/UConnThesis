name: Build sample thesis

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and R tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-extra texlive-fonts-recommended \
            texlive-science r-base-core r-cran-knitr
      - name: Build sample
        run: |
          make distclean
          make
          python3 tests/check_rnw.py
          test -s thesis.pdf
          test -s thesis.log
          test -s thesis.blg
          if grep -E 'LaTeX Warning|Package .* Warning|pdfTeX warning|Overfull|Underfull' thesis.log; then
            exit 1
          fi
          if grep 'Warning--' thesis.blg; then
            exit 1
          fi
      - name: Save PDF and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-thesis
          path: |
            thesis.pdf
            thesis.log
            thesis.blg
            Rnw/*.tex
            Rnw/figures/**/*.pdf
