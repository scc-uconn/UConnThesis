name: Build sample thesis

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Build sample
        run: |
          make
          if grep -E 'LaTeX Warning|Package .* Warning|pdfTeX warning|Overfull|Underfull' thesis.log; then
            exit 1
          fi
          if grep 'Warning--' thesis.blg; then
            exit 1
          fi
      - name: Save PDF and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-thesis
          path: |
            thesis.pdf
            thesis.log
            thesis.blg
